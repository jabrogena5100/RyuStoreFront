# Local development services: Postgres, and Mailpit (a local mail catcher: SMTP on 1025, inbox UI and API
# on http://localhost:8025). Nothing sent here leaves the machine. SeaweedFS is the local S3 for product images.
services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storefront}
      POSTGRES_USER: ${POSTGRES_USER:-storefront}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Local stand-in for S3 (product images): SeaweedFS with its S3 gateway on 8333. MinIO's community images are no longer
  # published (archived April 2026). No identities are configured, so the gateway accepts anonymous requests: fine for a
  # localhost-only dev store, never for anything reachable from outside. In AWS the same objects go to S3 behind CloudFront.
  seaweedfs:
    image: chrislusf/seaweedfs:4.55
    # Volumes grow 7 at a time on first write, so the cap must leave room; 64 MB volumes suit a few hundred images.
    command: server -s3 -s3.port=8333 -dir=/data -volume.max=32 -master.volumeSizeLimitMB=64
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweed:/data

volumes:
  pgdata:
  seaweed:
