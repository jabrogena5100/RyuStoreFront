spring.application.name=storefront

# Local run against compose.yaml (tests use Testcontainers and ignore these).
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:storefront}
spring.datasource.username=${POSTGRES_USER:storefront}
spring.datasource.password=${POSTGRES_PASSWORD:}

# Flyway owns the schema. Hibernate never creates or alters tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Sessions: stored in Postgres (tables from Flyway V6), cookie flags set here and asserted by AuthApiTests.
# Secure is false only so plain-HTTP local runs work; the AWS deployment sets STOREFRONT_COOKIE_SECURE=true.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${STOREFRONT_COOKIE_SECURE:false}

# Guest cart cookie (CART): random token, only its SHA-256 is stored. Secure follows the session cookie setting.
storefront.cart.cookie-secure=${STOREFRONT_COOKIE_SECURE:false}
storefront.cart.guest-ttl-days=30

# Checkout: flat shipping (minor units) and how long a pending order holds its stock. 30 minutes matches
# the shortest lifetime Stripe Checkout allows for a session (to be confirmed against Stripe's docs in phase 4).
storefront.checkout.shipping-flat-minor=800
storefront.checkout.reservation-ttl-minutes=30

# Background worker. Off by default (the API process and tests do not poll); the "worker" profile turns it on
# (application-worker.properties). The worker still serves HTTP so health checks can reach it.
storefront.worker.enabled=false
storefront.worker.poll-interval-ms=1000
storefront.worker.batch-size=20
storefront.worker.sweep-interval-ms=30000
storefront.outbox.max-attempts=10
spring.task.scheduling.pool.size=2
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s

# Email. Local: Mailpit from compose.yaml (SMTP localhost:1025). Timeouts are short so a dead mail server fails
# the outbox attempt quickly (it is retried with backoff) instead of hanging the worker.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=4000
spring.mail.properties.mail.smtp.writetimeout=4000
storefront.mail.from=${STOREFRONT_MAIL_FROM:orders@storefront.local}
# smtp (the spring.mail.* settings above) or ses (Amazon SES API with the task role; set in AWS by infra/session/ecs.tf).
storefront.mail.transport=${STOREFRONT_MAIL_TRANSPORT:smtp}
storefront.mail.ses-region=${AWS_REGION:us-west-2}
# A mail outage must delay emails, not take the shop out of the load balancer: keep SMTP out of /actuator/health.
management.health.mail.enabled=false

# Payments (Stripe). Keys come from the environment and are never committed; with no key the shop still runs
# and "pay" answers 503. Use a TEST-mode key (sk_test_...). Where the shopper returns to after Stripe's page:
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
storefront.public-base-url=${STOREFRONT_PUBLIC_BASE_URL:http://localhost:3000}
# Stripe requires a Checkout Session to last at least 30 minutes from creation; 31 leaves margin for the call itself.
storefront.payment.session-minutes=31
# The stock hold outlasts the payment page by this long, so a payment at the last second still has its stock.
storefront.payment.hold-grace-minutes=5

# Product images (V11, scripts/images/). Objects are served from here; the API returns <base-url>/<key> and the frontend
# appends -<width>.<avif|webp>. Local: SeaweedFS from compose.yaml. AWS: the CloudFront URL (set by the task definition).
storefront.images.base-url=${STOREFRONT_IMAGES_BASE_URL:http://localhost:8333/storefront-images}

# Demo data (the `seed` profile). "catalogue" loads the curated, photographed catalogue packaged at
# classpath:catalogue/catalogue.json (written by scripts/images/fetch.py) and falls back to "generated" when that file
# is absent; "generated" makes STOREFRONT_SEED_PRODUCTS random products without photos (used for the 50,000-product
# EXPLAIN runs).
storefront.seed.source=${STOREFRONT_SEED_SOURCE:catalogue}
